<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>KV Boshqaruv — Asosiy</title>
  <link rel="stylesheet" href="asosiy.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- SARLAVHA -->
  <header class="header">
    <h1>🏠 KV Boshqaruv</h1>
    <span class="header-badge">Asosiy</span>
  </header>

  <!-- STATISTIKA -->
  <section class="stats">
    <div class="stat-card">
      <div class="stat-icon">👥</div>
      <div class="stat-info">
        <span class="stat-label">Jami ijarachilar</span>
        <span class="stat-value" id="statJami">—</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">⏰</div>
      <div class="stat-info">
        <span class="stat-label">To'lovi yaqin</span>
        <span class="stat-value" id="statYaqin">—</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔴</div>
      <div class="stat-info">
        <span class="stat-label">Qarzdor</span>
        <span class="stat-value" id="statQarzdor">—</span>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">💰</div>
      <div class="stat-info">
        <span class="stat-label">Oylik foyda</span>
        <span class="stat-value" id="statFoyda">—</span>
      </div>
    </div>
  </section>

  <!-- KV LAR -->
  <section class="kv-section">
    <div class="kv-header">
      <h2>🏢 KV lar</h2>
      <button class="btn btn-primary" id="btnAddKv">+ KV qo'shish</button>
    </div>
    <div class="kv-grid" id="kvGrid">
      <p class="loading">Yuklanmoqda...</p>
    </div>
  </section>

  <!-- KV MODAL (qo'shish/tahrirlash) -->
  <div class="modal-overlay" id="kvModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="kvModalTitle">KV qo'shish</h3>
        <button class="modal-close" id="kvModalClose">✖</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="kvId">
        <label>Nomi *</label>
        <input type="text" id="kvNomi" placeholder="1-xonadon">
        <label>Sig'imi * (necha kishi)</label>
        <input type="number" id="kvSigimi" placeholder="4" min="1">
        </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="kvCancel">Bekor qilish</button>
        <button class="btn btn-primary" id="kvSave">Saqlash</button>
      </div>
    </div>
  </div>

  <!-- O'CHIRISH TASDIQLASH MODAL -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal modal-small">
      <div class="modal-header">
        <h3>O'chirishni tasdiqlang</h3>
      </div>
      <div class="modal-body">
        <p>Rostdan ham <b id="deleteKvNomi"></b> ni o'chirmoqchimisiz?</p>
        <p class="warning">Barcha ijarachilar va ma'lumotlar ham o'chadi!</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="deleteCancel">Bekor qilish</button>
        <button class="btn btn-danger" id="deleteConfirm">O'chirish</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="asosiy.js"></script>
</body>
</html>
