<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbatchilik</title>
  <link rel="stylesheet" href="navbatchi.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- SARLAVHA -->
  <header class="header">
    <button class="back-btn" onclick="window.location.href='index.html'">←</button>
    <h1>👮 Navbatchilik</h1>
  </header>

  <!-- TABLAR -->
  <div class="tabs">
    <button class="tab active" data-tab="navbatchilar">👥 Navbatchilar</button>
    <button class="tab" data-tab="vazifalar">⚙️ Vazifalar sozlash</button>
  </div>

  <main class="container">

    <!-- ========== 1-TAB: NAVBATCHILAR ========== -->
    <div id="tabNavbatchilar" class="tab-content active">

      <!-- AVVALGI -->
      <section class="group">
        <h2 class="group-head avvalgi">⏮️ Avvalgi navbatchilar</h2>
        <div id="avvalgiList"><p class="loading">Yuklanmoqda...</p></div>
      </section>

      <!-- BUGUNGI -->
      <section class="group">
        <h2 class="group-head bugungi">🔵 Bugungi navbatchilar</h2>
        <div id="bugungiList"><p class="loading">Yuklanmoqda...</p></div>
      </section>

      <!-- KEYINGI -->
      <section class="group">
        <h2 class="group-head keyingi">⏭️ Keyingi navbatchilar</h2>
        <div id="keyingiList"><p class="loading">Yuklanmoqda...</p></div>
      </section>

    </div>

    <!-- ========== 2-TAB: VAZIFALAR SOZLASH ========== -->
    <div id="tabVazifalar" class="tab-content">

      <section class="card">
        <h2>📅 Navbatchilik sozlamalari</h2>
        <div class="form-group">
          <label>Boshlanish sanasi *</label>
          <input type="date" id="sozlamaBoshlanish">
        </div>
        <div class="form-group">
          <label>Oraliq (necha kunda almashinadi) *</label>
          <input type="number" id="sozlamaOraliq" placeholder="4" min="1">
        </div>
      </section>

      <section class="card">
        <h2>📋 Vazifalar ro'yxati</h2>
        <div id="vazifaList"><p class="loading">Yuklanmoqda...</p></div>
        <div class="add-vazifa-row">
          <input type="text" id="yangiVazifa" placeholder="Yangi vazifa nomi">
          <button class="btn btn-primary" id="btnAddVazifa">+ Qo'sh</button>
        </div>
        <p class="hint" id="vazifaSon">Jami: 0 vazifa → 0 navbatchi</p>
      </section>

      <button class="btn btn-primary btn-full" id="btnSaqlash">
        💾 Saqlash va navbatchilarni tanlash
      </button>

    </div>

  </main>

  <!-- PASTKI TUGMALAR -->
  <nav class="bottom-nav">
    <button class="nav-btn" data-page="ijarachi">👥 Ijarachi</button>
    <button class="nav-btn" data-page="xarajat">💸 Xarajat</button>
    <button class="nav-btn" data-page="hisobot">📊 Hisobot</button>
    <button class="nav-btn active" data-page="navbatchi">👮 Navbatchi</button>
  </nav>

  <script src="config.js"></script>
  <script src="navbatchi.js"></script>
</body>
</html>
